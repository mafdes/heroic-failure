<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="dummyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241911"/>
      <stop offset="50%" stop-color="#3d2b1b"/>
      <stop offset="100%" stop-color="#140d08"/>
    </linearGradient>
    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#c99c32"/>
      <stop offset="100%" stop-color="#785915"/>
    </linearGradient>
    <filter id="dummyGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#dummyBg)"/>

  <!-- Medieval Crest Circle -->
  <circle cx="200" cy="140" r="85" fill="none" stroke="url(#goldFrame)" stroke-width="2" stroke-dasharray="10,5"/>
  <circle cx="200" cy="140" r="65" fill="#17100a" stroke="url(#goldFrame)" stroke-width="1.5"/>

  <!-- Guild Skull / Helmet Emblem -->
  <path d="M 180,110 Q 200,90 220,110 L 220,150 Q 220,175 200,185 Q 180,175 180,150 Z" fill="url(#goldFrame)" filter="url(#dummyGlow)"/>
  <circle cx="190" cy="135" r="5" fill="#17100a"/>
  <circle cx="210" cy="135" r="5" fill="#17100a"/>
  <path d="M 193,160 L 207,160 L 204,170 L 196,170 Z" fill="#17100a"/>

  <!-- Cross Swords behind -->
  <line x1="130" y1="70" x2="270" y2="210" stroke="url(#goldFrame)" stroke-width="4" stroke-linecap="round"/>
  <line x1="270" y1="70" x2="130" y2="210" stroke="url(#goldFrame)" stroke-width="4" stroke-linecap="round"/>
</svg>
